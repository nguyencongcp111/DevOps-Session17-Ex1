<source>
  @type tail
  path /app-logs/app.log
  pos_file /tmp/app.log.pos
  tag order.app
  read_from_head true
  <parse>
    @type json
  </parse>
</source>

<match order.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix order-service
  <buffer>
    flush_interval 5s
  </buffer>
</match>
